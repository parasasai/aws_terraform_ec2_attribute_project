<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRI HAYAGREEVA HIGH SCHOOL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            background: #ffffff;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border-top: 8px solid #0056b3;

        h1 {

            font-size: 2.5em;
            margin-bottom: 5px;

            font-size: 1.1em;
            color: #28a745;

            margin-top: 0;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .classes {
            font-size: 1.5em;
            font-weight: 600;
            background-color: #e9ecef;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            color: #495057;
            margin-bottom: 25px;
        }
        .tagline {
            font-size: 1.3em;
            font-style: italic;
            color: #dc3545;
            margin: 20px 0;
            font-weight: bold;
        }
        .results {
            background: #fff3cd;
            border: 2px dashed #ffc107;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            color: #856404;
            margin: 30px 0;
        }
        .address {
            font-size: 0.95em;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
            padding-top: 20px;

        <div class="govt-tag">(Recognised by Govt of TS)</div>

        <div class="tagline">🏆 Best school in Balanagar Area 🏆</div>
        
        <div class="results">
            🎯 100% 10th Class Results for Academic Year 2025-2026
        </div>
        
        <div class="address">
            📍 6-10-117/b/1, Near Govt Hospital, Vinayak Nagar, Balanagar, Hyderabad
        </div>
